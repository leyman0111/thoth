name: Provision thoth server

# Ручной, идемпотентный: можно запускать повторно (например, чтобы обновить секреты в .env).
#
# Работает БЕЗ sudo: пользователь deploy не имеет root-прав. Всё, что требует root
# (Docker, пользователь deploy в группе docker, каталог /opt/thoth с владельцем deploy, firewalld,
# SELinux для nginx), делается один раз вручную скриптом setup-users.sh — см. DEPLOY.md.
on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Provision (/opt/thoth/.env)
        uses: appleboy/ssh-action@v1
        env:
          APP_DIR: /opt/thoth
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          THOTH_WEBAPP_URL: ${{ vars.THOTH_WEBAPP_URL }}
          APP_MEM_LIMIT: ${{ vars.APP_MEM_LIMIT }}
          DB_MEM_LIMIT: ${{ vars.DB_MEM_LIMIT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: APP_DIR,DB_PASSWORD,TELEGRAM_BOT_TOKEN,OPENROUTER_API_KEY,THOTH_WEBAPP_URL,APP_MEM_LIMIT,DB_MEM_LIMIT
          script: |
            set -euo pipefail
            echo "== Сервер: $(. /etc/os-release && echo "$PRETTY_NAME"), пользователь $(id -un), RAM $(free -m | awk '/^Mem:/{print $2}') МБ"
            fail() { echo "::error::$1"; exit 1; }

            echo "== [1/3] Проверка секретов"
            for v in DB_PASSWORD TELEGRAM_BOT_TOKEN OPENROUTER_API_KEY; do
              [ -n "${!v}" ] || fail "Секрет $v не задан"
            done
            for v in DB_PASSWORD TELEGRAM_BOT_TOKEN OPENROUTER_API_KEY THOTH_WEBAPP_URL APP_MEM_LIMIT DB_MEM_LIMIT; do
              case "${!v}" in *"'"*) fail "$v не должен содержать одинарную кавычку";; esac
            done
            [ -n "$THOTH_WEBAPP_URL" ] || echo "::warning::Переменная THOTH_WEBAPP_URL не задана — кнопки бота не откроют Mini App"

            echo "== [2/3] Docker и каталог (подготавливаются вручную от root, см. DEPLOY.md)"
            command -v docker >/dev/null 2>&1 || fail "Docker не установлен — запустите setup-users.sh от root"
            docker info >/dev/null 2>&1 || fail "Пользователь $(id -un) не может работать с docker — добавьте его в группу docker (usermod -aG docker $(id -un)) и перезайдите"
            docker compose version
            [ -d "$APP_DIR" ] || fail "Нет $APP_DIR — от root: install -d -m 750 -o $(id -un) -g $(id -un) $APP_DIR"
            [ -w "$APP_DIR" ] || fail "Нет прав на запись в $APP_DIR — от root: chown $(id -un): $APP_DIR"

            echo "== [3/3] $APP_DIR/.env"
            OLD_TAG="$(grep -s '^IMAGE_TAG=' "$APP_DIR/.env" | cut -d= -f2- || true)"
            TMP="$(mktemp "$APP_DIR/.env.XXXXXX")"
            trap 'rm -f "$TMP"' EXIT
            {
              q() { printf "%s='%s'\n" "$1" "$2"; }
              q DB_NAME thoth
              q DB_USERNAME thoth
              q DB_PASSWORD "$DB_PASSWORD"
              q TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
              q OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
              q THOTH_WEBAPP_URL "$THOTH_WEBAPP_URL"
              if [ -n "$APP_MEM_LIMIT" ]; then q APP_MEM_LIMIT "$APP_MEM_LIMIT"; fi
              if [ -n "$DB_MEM_LIMIT" ]; then q DB_MEM_LIMIT "$DB_MEM_LIMIT"; fi
              echo "IMAGE_TAG=${OLD_TAG:-latest}"
            } > "$TMP"
            chmod 600 "$TMP"
            mv -f "$TMP" "$APP_DIR/.env"
            trap - EXIT

            # пароль БД postgres берёт только при первой инициализации тома
            if docker volume inspect thoth_pgdata >/dev/null 2>&1; then
              echo "::notice::Том thoth_pgdata уже есть: смена DB_PASSWORD сама не применится к существующей БД (ALTER ROLE вручную)"
            fi

            echo "== Готово"
            ls -la "$APP_DIR"

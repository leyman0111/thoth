# Шаблон для nginx хоста: /etc/nginx/conf.d/thoth.conf
# Замените thoth.example.com на свой домен и выпустите сертификат:
#   sudo certbot --nginx -d thoth.example.com
# Mini App в Telegram открывается только по HTTPS.
# SELinux (AlmaLinux): разрешить nginx ходить на 127.0.0.1:8080 — sudo setsebool -P httpd_can_network_connect 1

server {
    listen 80;
    server_name thoth.example.com;

    # фото чека до 10 МБ (spring.servlet.multipart.max-file-size)
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # распознавание чека через OpenRouter может идти до 90 с
        proxy_read_timeout 120s;
    }

    # наружу не отдаём
    location /actuator/ {
        return 404;
    }
}
